<!DOCTYPE html>
<html>
<head>
    <title>Database Debug Dump</title>
</head>
<body>
    <h1>Database Dump</h1>
    <div id="output">Loading...</div>

    <script type="module">
        import db from './assets/js/db.js';

        async function dump() {
            try {
                const classes = await db.classes.toArray();
                const subjects = await db.subjects.toArray();
                const assignments = await db.subject_assignments.toArray();
                const profiles = await db.profiles.toArray();
                const timetable = await db.timetable.toArray();

                let html = '<h2>Classes</h2><ul>';
                classes.forEach(c => {
                    html += `<li>ID: ${c.id}, Name: ${c.name}, Level: ${c.level}</li>`;
                });
                html += '</ul>';

                html += '<h2>Subjects</h2><ul>';
                subjects.forEach(s => {
                    html += `<li>ID: ${s.id}, Name: ${s.name}, Credits: ${s.credits}</li>`;
                });
                html += '</ul>';

                html += '<h2>Subject Assignments</h2><ul>';
                assignments.forEach(a => {
                    const s = subjects.find(sub => sub.id === a.subject_id);
                    const t = profiles.find(p => p.id === a.teacher_id);
                    html += `<li>ID: ${a.id}, Class: ${a.class_name}, Subject: ${s ? s.name : a.subject_id} (${a.subject_id}), Teacher: ${t ? t.full_name : a.teacher_id}, Specialization: ${a.specialization}</li>`;
                });
                html += '</ul>';

                html += '<h2>Timetable Entries (SSS 2 & SSS 3)</h2><table border="1"><tr><th>Class</th><th>SubClass</th><th>Day</th><th>Period</th><th>Subject</th></tr>';
                const sssEntries = timetable.filter(t => t.class_name.includes('SSS 2') || t.class_name.includes('SSS 3'));
                // Sort by class_name, day_of_week, period_number
                const dayWeight = { 'Monday': 1, 'Tuesday': 2, 'Wednesday': 3, 'Thursday': 4, 'Friday': 5 };
                sssEntries.sort((a, b) => {
                    const c = a.class_name.localeCompare(b.class_name);
                    if (c !== 0) return c;
                    const d = dayWeight[a.day_of_week] - dayWeight[b.day_of_week];
                    if (d !== 0) return d;
                    return a.period_number - b.period_number;
                });
                sssEntries.forEach(t => {
                    const sName = subjectMap[t.subject_id] || t.subject_id;
                    html += `<tr><td>${t.class_name}</td><td>${t.sub_class}</td><td>${t.day_of_week}</td><td>${t.period_number}</td><td>${sName} (${t.subject_id})</td></tr>`;
                });
                html += '</table>';

                document.getElementById('output').innerHTML = html;
            } catch (err) {
                document.getElementById('output').innerHTML = 'Error: ' + err.message + '\n' + err.stack;
            }
        }
        dump();
    </script>
</body>
</html>
