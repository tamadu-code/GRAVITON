<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graviton User Audit</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; padding: 2rem; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h1 { color: #1e293b; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; background: #f1f5f9; padding: 1rem; color: #475569; font-size: 0.875rem; }
        td { padding: 1rem; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
        .badge { padding: 0.25rem 0.5rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .role-admin { background: #fee2e2; color: #991b1b; }
        .role-teacher { background: #eef2ff; color: #3730a3; }
        .role-student { background: #f0fdf4; color: #166534; }
        .missing { background: #fff7ed; color: #9a3412; font-weight: bold; border: 1px solid #fdba74; }
        .stats { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .stat-card { flex: 1; padding: 1rem; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; }
        .stat-val { font-size: 1.5rem; font-weight: 800; color: #4338ca; }
    </style>
</head>
<body>
    <div class="container">
        <h1>User Email Audit</h1>
        <div id="stats-area" class="stats">Loading stats...</div>
        <table id="user-table">
            <thead>
                <tr>
                    <th>Full Name</th>
                    <th>Role</th>
                    <th>Email Address</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="user-list">
                <tr><td colspan="4">Fetching users from Supabase...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const SB_URL = 'https://urqygjltionvaxuacfzr.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVycXlnamx0aW9udmF4dWFjZnpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMzEzMDEsImV4cCI6MjA5MjYwNzMwMX0.Vpk7rifsfjMCVBSYpEdVzkHv3w324iKp8B7urlKc_e4';

        async function auditUsers() {
            try {
                const response = await fetch(`${SB_URL}/rest/v1/profiles?select=full_name,role,email,status&order=role.asc`, {
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
                });
                const users = await response.json();
                
                const list = document.getElementById('user-list');
                const stats = document.getElementById('stats-area');
                list.innerHTML = '';

                let missingCount = 0;
                let adminCount = 0;
                let teacherCount = 0;

                users.forEach(u => {
                    const isMissing = !u.email || u.email.trim() === '';
                    if (isMissing) missingCount++;
                    if (u.role === 'Admin') adminCount++;
                    if (u.role === 'Teacher') teacherCount++;

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${u.full_name || 'N/A'}</td>
                        <td><span class="badge role-${u.role.toLowerCase()}">${u.role}</span></td>
                        <td class="${isMissing ? 'missing' : ''}">${u.email || 'MISSING'}</td>
                        <td>${u.status}</td>
                    `;
                    list.appendChild(row);
                });

                stats.innerHTML = `
                    <div class="stat-card"><div>Total Users</div><div class="stat-val">${users.length}</div></div>
                    <div class="stat-card"><div>Admins</div><div class="stat-val">${adminCount}</div></div>
                    <div class="stat-card"><div>Teachers</div><div class="stat-val">${teacherCount}</div></div>
                    <div class="stat-card" style="border-color: #f97316;"><div>Missing Emails</div><div class="stat-val" style="color: #ea580c;">${missingCount}</div></div>
                `;

            } catch (e) {
                document.getElementById('user-list').innerHTML = `<tr><td colspan="4" style="color:red">Error: ${e.message}</td></tr>`;
            }
        }

        auditUsers();
    </script>
</body>
</html>
